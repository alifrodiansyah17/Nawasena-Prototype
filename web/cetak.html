<script>
(function () {
  'use strict';
  var jenis = new URLSearchParams(location.search).get('jenis') || 'laporan';
  var akar = document.getElementById('isi');
  function el(tag, cls, teks) { var e = document.createElement(tag); if (cls) e.className = cls; if (teks != null) e.textContent = teks; return e; }
  function tambah(p, tag, cls, teks) { var e = el(tag, cls, teks); p.appendChild(e); return e; }
  function daftar(p, arr, fn) { (arr || []).forEach(function (x) { fn(p, x); }); }
  function jp(p, x) { var k = tambah(p, 'div', 'kotak'); tambah(k, 'h3', null, x.j); tambah(k, 'p', null, x.p); }

  function bulir(e) {
    var a = String(e.apa || '').trim(); if (!a) return '';
    var t = a.charAt(0).toUpperCase() + a.slice(1);
    if (String(e.berapa || '').trim()) t += ' (' + e.berapa.trim() + ')';
    if (String(e.hasil || '').trim()) t += ', ' + e.hasil.trim();
    return t.replace(/[.\s]+$/, '') + '.';
  }

  function cetakCV(c) {
    var w = tambah(akar, 'div', 'cv');
    tambah(w, 'h1', null, String(c.nama || '').toUpperCase());
    if (c.posisi) tambah(w, 'p', null, c.posisi).style.fontWeight = '700';
    tambah(w, 'p', null, [c.kota, c.hp, c.email, c.linkedin].filter(Boolean).join(' | '));
    var prof = c.profilSendiri || c.profil;
    if (prof) { tambah(w, 'h2', null, 'PROFIL PROFESIONAL'); tambah(w, 'p', null, prof); }
    function blok(judul, arr) {
      arr = (arr || []).filter(function (x) { return x.jabatan || x.tempat || x.apa; });
      if (!arr.length) return;
      tambah(w, 'h2', null, judul);
      arr.forEach(function (x) {
        var b = tambah(w, 'div', 'baris');
        tambah(b, 'span', null, [x.jabatan, x.tempat].filter(Boolean).join(' | '));
        tambah(b, 'span', null, [x.mulai, x.selesai].filter(Boolean).join(' - '));
        if (bulir(x)) { var u = tambah(w, 'ul'); tambah(u, 'li', null, bulir(x)); }
      });
    }
    blok('PENGALAMAN KERJA', c.kerja);
    blok('ORGANISASI DAN PROYEK', c.organisasi);
    var pend = (c.pendidikan || []).filter(function (x) { return x.gelar || x.kampus; });
    if (pend.length) {
      tambah(w, 'h2', null, 'PENDIDIKAN');
      pend.forEach(function (x) {
        var b = tambah(w, 'div', 'baris');
        tambah(b, 'span', null, [x.gelar, [x.kampus, x.kota].filter(Boolean).join(', ')].filter(Boolean).join(' | '));
        tambah(b, 'span', null, x.lulus || '');
        if (x.ipk) tambah(w, 'p', null, 'IPK ' + x.ipk + '/4,00');
      });
    }
    var kh = [];
    if ((c.keahlian || []).length) kh.push(['Teknis', c.keahlian.join(', ')]);
    if ((c.tools || []).length) kh.push(['Tools', c.tools.join(', ')]);
    if ((c.bahasa || []).length) kh.push(['Bahasa', c.bahasa.join(', ')]);
    if (kh.length) { tambah(w, 'h2', null, 'KEAHLIAN'); kh.forEach(function (k) { var p = tambah(w, 'p'); tambah(p, 'b', null, k[0] + ': '); p.appendChild(document.createTextNode(k[1])); }); }
    var ser = (c.sertifikasi || []).filter(function (x) { return x.nama; });
    if (ser.length) { tambah(w, 'h2', null, 'SERTIFIKASI'); ser.forEach(function (x) { tambah(w, 'p', null, [x.nama, x.penerbit, x.tahun].filter(Boolean).join(' | ')); }); }
    document.title = 'CV ' + (c.nama || '');
  }

  // sama dengan identitasDari di app.js: sudah bekerja → jabatan sekarang · lama pengalaman kerja
  function identitasDari(b1) {
    b1 = b1 || {};
    var th = Number(b1.tahun_kerja) || 0, peran = String(b1.peran_kini || '').trim();
    if (th > 0 && peran) return peran + ' · ' + (th < 1 ? 'kurang dari 1 tahun' : Math.round(th) + ' tahun') + ' pengalaman kerja';
    return String(b1.identitas || '');
  }
  function x(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function svgData(svg) {
    svg = svg || ''; if (svg && svg.indexOf('xmlns=') < 0) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  var BAG = (window.DATA && window.DATA.BAGIAN) || [];
  var TINT = { '#38BDF8': '#F0F9FF', '#009FE3': '#E0F2FE', '#0284C7': '#E0F2FE', '#CCA700': '#FEF9C3' };
  function kepala(n) {
    var b = BAG[n - 1] || {}, w = b.warna || '#0284C7';
    return '<div class="kepala" style="background:' + (TINT[w] || '#F0F9FF') + ';"><div class="no" style="background:' + w + ';">' + n + '</div><div>'
      + '<div class="lb" style="color:' + (w === '#CCA700' ? '#92400E' : w) + ';">Bagian ' + n + '</div><h2>' + x(b.nama) + '</h2><p>' + x(b.sub) + '</p></div></div>';
  }
  function sub(t, w) { return '<div class="sub2"><i style="background:' + (w || '#009FE3') + ';"></i>' + x(t) + '</div>'; }
  function kartu(cls, j, p, chip) { return '<div class="kartu ' + cls + '">' + (j ? '<h3>' + x(j) + '</h3>' : '') + (chip || '') + '<div class="isi">' + x(p) + '</div></div>'; }
  function fld(k, v) { return v ? '<div class="fld"><b>' + x(k) + '</b><span>' + x(v) + '</span></div>' : ''; }
  function chips(arr, cls) { return '<div class="chips ' + (cls || '') + '">' + (arr || []).map(function (t) { return '<span>' + x(t) + '</span>'; }).join('') + '</div>'; }

  // Isi dipecah jadi blok yang tidak boleh terpotong. Blok lalu ditata ke halaman A4:
  //  * setiap bagian dan setiap topik besar (tiap arah karir, tempat kerja) mulai di halaman baru
  //  * blok yang tidak muat pindah utuh ke halaman berikutnya, dengan pita "lanjutan"
  //  * sisa kecil di akhir bagian ditarik ke halaman sebelumnya (diperkecil sedikit) supaya tidak tercecer sendirian
  var TINGGI = 259 * 96 / 25.4;   // tinggi isi satu halaman (A4 − ruang atas dan kaki halaman), dalam px
  async function cetakLaporan(nama, b1, L) {
    var r = L.rencana || {}, A = L.arahA || {}, B = L.arahB || {}, bl = [];
    var a = b1.arketipe || {}, M = window.MASKOT || {};
    var maskot = svgData(M[a.maskot] || M.analyst || '');
    var tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    var bagNow = 0;
    function blok(html, baru) { bl.push({ html: html, baru: !!baru, bag: bagNow }); }
    function bagian(n) { bagNow = n; }

    // ---- sampul
    blok('<div class="sampul2"><img class="mtr" src="aset/matahari.svg" alt=""><div class="merek"><img class="logo" src="aset/logo-nawasena-putih.png" alt="Nawasena"></div>'
      + '<div class="kicker">Peta potensimu</div><h1>Mengenal Diri<br>dan Arah Karir</h1>'
      + '<div class="nama">' + x(nama) + '</div><div class="idn">' + x(identitasDari(b1)) + '</div>'
      + '<div class="ark"><img src="' + maskot + '" alt=""><div><div class="lb">Cara kerja kamu</div><h2>' + x(a.nama) + (a.sub ? ' · ' + x(a.sub) : '') + '</h2><p>' + x(a.teks) + '</p></div></div>'
      + '<div class="dftr">' + BAG.map(function (b) { return '<div><b>' + b.no + '</b>' + x(b.nama) + '</div>'; }).join('') + '</div>'
      + '<div class="kaki">Disusun ' + tgl + ' dari jawaban kuis yang kamu isi sendiri dan dari CV yang kamu kirim. Isinya buat membantu kamu mengenali cara kerjamu dan memilih langkah berikutnya, bukan penilaian akhir tentang dirimu.</div></div>', true);

    // ---- Bagian 1
    bagian(1);
    blok(kepala(1) + (b1.contoh || r.contoh ? '<p class="contoh" style="margin-bottom:12px;">Mode uji coba: isi laporan ini masih contoh, belum dibuat dari CV dan jawaban kuismu.</p>' : '')
      + '<div class="hero"><div class="lb">Cara kerja kamu</div><h3>' + x(a.nama) + (a.sub ? ' · ' + x(a.sub) : '') + '</h3><p>' + x(a.teks) + '</p></div>', true);
    blok('<div class="kolom hijau"><div class="jdl" style="color:#15803D;">↗ Yang paling kamu banget</div><div class="grid2">'
      + (b1.paling || []).map(function (q) { return kartu('', q.j, q.p, q.c ? '<span class="chip h">' + x(q.c) + '</span>' : ''); }).join('') + '</div></div>');
    blok('<div class="kolom kuning"><div class="jdl" style="color:#92400E;">△ Yang masih perlu dilatih</div><div class="grid2">'
      + (b1.dilatih || []).map(function (q) { return kartu('', q.j, q.p); }).join('') + '</div>'
      + '<p class="catat" style="color:#713F12;margin:8px 2px 0;">Dua kotak ini sama-sama normal. Yang hijau sudah jalan tanpa kamu pikirkan, yang kuning butuh tenaga lebih.</p></div>');
    var tk = [b1.tokoh_nyata, b1.tokoh_fiksi].filter(Boolean);
    if (tk.length) blok(sub('Yang cara kerjanya mirip kamu', '#38BDF8') + '<div class="dua">' + tk.map(function (t, i) {
      return kartu(i ? 'kuning' : 'biru', t.nama, t.why, '<span class="chip ' + (i ? 'a' : 'b') + '">' + x(t.peran || t.asal) + '</span>');
    }).join('') + '</div><p class="catat">Nama di atas cuma perbandingan cara kerja, bukan tanda mereka kenal atau mendukung Nawasena.</p>');

    // ---- Bagian 2
    var b2 = r.b2 || {};
    bagian(2);
    blok(kepala(2) + '<div class="hero"><div class="lb">Tipe karirmu sekarang</div><h3>' + x(b2.judul) + '</h3><p>' + x(b2.teks) + '</p></div>', true);
    blok([['Keahlian', b2.keahlian, '#009FE3'], ['Keluasan', b2.keluasan, '#16A34A'], ['Sinyal memimpin', b2.memimpin, '#FFD100']].map(function (m) {
      return m[1] ? '<div class="metrik" style="border-color:' + m[2] + ';"><b>' + m[0] + '</b><span>' + x(m[1]) + '</span></div>' : '';
    }).join(''));
    if ((b2.jalan || []).length) blok(sub('Dua jalan dari sini', '#009FE3') + '<div class="dua">' + b2.jalan.map(function (j, i) {
      return kartu(i ? 'kuning' : 'biru', j.judul, j.teks, j.ref ? '<span class="chip ' + (i ? 'a' : 'b') + '">' + x(j.ref) + '</span>' : '');
    }).join('') + '</div>');
    if (b2.catatan) blok('<div class="sorot"><i></i><div>Yang perlu kamu timbang: ' + x(String(b2.catatan).replace(/^\s*yang perlu kamu timbang\s*(adalah|:)?\s*/i, '')) + '</div></div>');

    // ---- Bagian 3
    var b3 = r.b3 || {}, UW = [['#0284C7', '#F0F9FF'], ['#16A34A', '#F0FDF4'], ['#CA8A04', '#FEF9C3']];
    bagian(3);
    blok(kepala(3) + ((b3.ubin || []).length ? '<div class="tiga">' + b3.ubin.map(function (u, i) {
      var w = UW[i % 3], pj = String(u.angka || '').length > 6;
      return '<div class="ubin" style="background:' + w[1] + ';border:1px solid ' + w[0] + '33;"><div class="n" style="color:' + w[0] + ';' + (pj ? 'font-size:12pt;' : '') + '">' + x(u.angka) + '</div><div class="l">' + x(u.label) + '</div></div>';
    }).join('') + '</div>' : ''), true);
    blok('<div class="dua"><div class="kolom hijau"><div class="jdl" style="color:#15803D;">＋ Yang lagi jadi keunggulanmu</div>'
      + (b3.plus || []).map(function (q) { return kartu('', q.j, q.p); }).join('') + '</div>'
      + '<div class="kolom kuning"><div class="jdl" style="color:#92400E;">－ Yang bisa jadi tantangan</div>'
      + (b3.minus || []).map(function (q) { return kartu('', q.j, q.p); }).join('') + '</div></div>'
      + (b3.sorot ? '<div class="sorot"><i></i><div>' + x(b3.sorot) + '</div></div>' : ''));
    var ce = b3.cerita || {};
    blok(sub('Perkenalan 60 detik', '#009FE3') + [['Siapa kamu', ce.siapa], ['Buktinya', ce.bukti], ['Kenapa arah ini', ce.kenapa]].map(function (c, i) {
      return '<div class="tahap"><div class="bul">' + (i + 1) + '</div><div><h4>' + c[0] + '</h4><div class="isi" style="color:#475569;font-size:9.5pt;">' + x(c[1]) + '</div></div></div>';
    }).join(''), true);
    (b3.tanya || []).forEach(function (t, i) {
      blok((i === 0 ? sub('Tiga pertanyaan yang paling mungkin muncul', '#FFD100') + (b3.tanya_lead ? '<p class="catat" style="margin:-4px 0 8px;">' + x(b3.tanya_lead) + '</p>' : '') : '')
        + '<div class="kartu putih"><h3>' + (i + 1) + '. ' + x(t.t) + '</h3><div class="tanya3">'
        + '<div style="background:#F0F9FF;"><b style="color:#0369A1;">Yang sebenarnya dicek</b>' + x(t.cek) + '</div>'
        + '<div style="background:#F0FDF4;"><b style="color:#15803D;">Cerita yang bisa kamu pakai</b>' + x(t.pakai) + '</div>'
        + '<div style="background:#FFF7ED;"><b style="color:#C2410C;">Yang biasanya kurang kuat</b>' + x(t.kurang) + '</div></div></div>');
    });

    // ---- Bagian 4
    var b4 = r.b4 || {};
    bagian(4);
    blok(kepala(4) + (b4.pembuka ? '<p style="color:#334155;">' + x(b4.pembuka) + '</p>' : ''), true);
    (b4.banding || []).forEach(function (q) {
      blok('<div class="banding"><div style="background:#FFF1F2;"><b style="color:#BE123C;">Ditulis gini</b>' + x(q.sblm) + '</div>'
        + '<div style="background:#F0FDF4;"><b style="color:#15803D;">Jadikan gini</b>' + x(q.sdh) + '</div></div>');
    });
    blok('<div class="dua"><div class="kolom kuning"><div class="jdl" style="color:#92400E;">⚡ Yang paling cepat terasa efeknya</div>'
      + (b4.segera || []).map(function (q) { return kartu('', q.j, q.p); }).join('') + '</div>'
      + '<div class="kolom biru"><div class="jdl" style="color:#0369A1;">★ Yang bisa bikin CV-mu lebih kuat</div>'
      + (b4.kuat || []).map(function (q) { return kartu('', q.j, q.p); }).join('') + '</div></div>'
      + (b4.sorot ? '<div class="sorot"><i></i><div>' + x(b4.sorot) + '</div></div>' : ''));

    // ---- Bagian 5: ringkasan, lalu tiap arah di halamannya sendiri
    var b5 = r.b5 || {}, arah = r.arah || [];
    var peran = (A.peran || []).concat(B.peran || []);
    bagian(5);
    blok(kepala(5) + (b5.intro ? '<p style="color:#334155;margin-bottom:12px;">' + x(b5.intro) + '</p>' : '')
      + '<div class="dua">' + peran.map(function (q, i) {
        return '<div class="kartu biru" style="display:flex;gap:10px;align-items:center;margin:0;"><div class="tahap" style="margin:0;"><div class="bul">' + (i + 1) + '</div></div><div><h3 style="margin:0;">' + x(q.nama) + '</h3><div class="isi" style="font-size:8.5pt;">' + x(q.fam) + '</div></div></div>';
      }).join('') + '</div>', true);
    if (b5.benang) blok('<div class="kartu kuning"><h3 style="color:#92400E;">Yang menghubungkan keenamnya</h3><div class="isi">' + x(b5.benang) + '</div></div>');
    if (b5.kurang) blok('<div class="kartu putih"><h3 style="color:#475569;">Yang kurang cocok buat kamu</h3><div class="isi">' + x(b5.kurang) + '</div></div>');
    peran.forEach(function (q, i) {
      var kel = (arah[i] || {}).kel;
      blok('<div class="arah"><div class="atas"><div class="no">' + (i + 1) + '</div><div><h3>' + x(q.nama) + '</h3><p>' + x(q.fam) + '</p></div>'
        + (kel ? '<span class="kel">' + x(kel) + '</span>' : '') + '</div><div class="badan">'
        + (q.fun ? '<div class="fun">' + x(q.fun) + '</div>' : '')
        + '<div class="dua"><div>' + fld('Yang dibutuhkan', q.comp) + fld('Yang sudah kamu punya', q.punya) + fld('Kenapa cocok', q.why) + '</div>'
        + '<div>' + fld('Hari-harinya', q.day) + fld('Yang akan menantang', q.chal) + fld('Jalur karir', q.path) + '</div></div>'
        + ((q.gaji || []).length ? '<div class="fld" style="margin-bottom:2px;"><b>Kisaran gaji</b></div><div class="gaji">' + q.gaji.map(function (g) { return '<div><div class="k">' + x(String(g.k).replace(/^[a-c]\.\s*/, '')) + '</div><div class="v">' + x(g.v) + '</div></div>'; }).join('') + '</div>' : '')
        + ((q.ind || []).length ? '<div class="fld"><b>Industri</b><span>' + q.ind.map(function (g) { return '<b style="display:inline;color:#0F172A;text-transform:none;letter-spacing:0;font-size:9pt;">' + x(g.k) + '</b> ' + x(g.v); }).join('<br>') + '</span></div>' : '')
        + (q.prep ? '<div class="kartu kuning" style="margin:6px 0 0;"><h3 style="color:#92400E;">Yang perlu kamu siapkan</h3><div class="isi">' + x(q.prep) + '</div></div>' : '')
        + '</div></div>', true);
    });
    var tp = B.tempat || {};
    if (tp.intro || (tp.daftar || []).length) {
      blok(sub('Tempat kerja yang paling pas buat kamu', '#16A34A') + (tp.intro ? '<p style="margin-bottom:10px;color:#334155;">' + x(tp.intro) + '</p>' : '')
        + '<div class="dua">' + (tp.daftar || []).map(function (q, i) { return kartu(i === 0 ? 'hijau' : 'putih', q.nama, q.teks, q.label ? '<span class="chip ' + (i === 0 ? 'h' : 'b') + '">' + x(q.label) + '</span>' : ''); }).join('') + '</div>', true);
      var ch = '';
      if ((tp.ciri || []).length) ch += '<div class="fld" style="margin-top:4px;"><b>Ciri tempat yang bikin kamu betah</b></div>' + chips(tp.ciri, 'h');
      if ((tp.cocok || []).length) ch += '<div class="fld"><b>Tanda cocok di lowongan</b></div>' + chips(tp.cocok);
      if ((tp.tanya || []).length) ch += '<div class="fld"><b>Bisa kamu tanyakan saat wawancara</b></div>' + chips(tp.tanya, 'k');
      if (ch) blok(ch);
    }

    // ---- Bagian 6
    var b6 = B.b6 || {};
    bagian(6);
    blok(kepala(6) + (b6.langkah || []).map(function (t, i) {
      return '<div class="kartu putih" style="display:flex;gap:12px;align-items:flex-start;"><div class="tahap" style="margin:0;"><div class="bul k">' + (i + 1) + '</div></div><div class="isi" style="color:#1E293B;font-size:10pt;padding-top:6px;">' + x(t) + '</div></div>';
    }).join(''), true);
    if (b6.batas) blok(sub('Yang perlu kamu tahu soal hasil ini', '#38BDF8') + '<div class="kartu biru"><div class="isi">' + x(b6.batas) + '</div></div>');
    blok('<div class="tutup"><h3>Ini potret hari ini, bukan garis finis.</h3><p>' + x(b6.tutup) + '</p><p style="margin-top:12px;font-weight:700;">— Nawasena · Sahabat karirmu</p></div>');

    // ---- ukur setiap blok di lebar kertas yang sama dengan hasil cetak
    akar.classList.add('lap');
    akar.innerHTML = '<div class="ukur">' + bl.map(function (b) { return '<div class="blk">' + b.html + '</div>'; }).join('') + '</div>';
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all([].slice.call(akar.querySelectorAll('img')).map(function (im) { return im.complete ? 0 : new Promise(function (ok) { im.onload = im.onerror = ok; }); }));
    var el = akar.querySelectorAll('.ukur > .blk');
    bl.forEach(function (b, i) { b.t = el[i].getBoundingClientRect().height + 6; });
    var pita = function (n) { var g = BAG[n - 1] || {}; return { html: '<div class="pita"><b style="background:' + (g.warna || '#0284C7') + ';">' + n + '</b>' + x(g.nama) + ' · lanjutan</div>', t: 30, bag: n }; };

    // ---- tata ke halaman
    var hal = [], cur = null;
    bl.forEach(function (b) {
      // muat kalau cukup; kalau halaman ini baru terisi kurang dari separuh, boleh diperkecil sampai 20% daripada meninggalkan halaman kosong
      var muat = cur && (cur.t + b.t <= TINGGI || (cur.t < TINGGI * 0.5 && cur.t + b.t <= TINGGI / 0.8));
      if (!cur || b.baru || !muat) {
        cur = { blok: [], t: 0, bag: b.bag, lanjut: !b.baru && !!cur };
        hal.push(cur);
        if (cur.lanjut && b.bag) { var pt = pita(b.bag); cur.blok.push(pt); cur.t += pt.t; }
      }
      cur.blok.push(b); cur.t += b.t;
    });
    // sisa kecil yang tercecer: gabung ke halaman sebelumnya kalau cukup dengan diperkecil maksimal 15%
    for (var i = hal.length - 1; i > 0; i--) {
      var h = hal[i], sbl = hal[i - 1];
      if (!h.lanjut) continue;
      var isi = h.t - 30;
      if (sbl.t + isi <= TINGGI / 0.85) { sbl.blok = sbl.blok.concat(h.blok.slice(1)); sbl.t += isi; hal.splice(i, 1); }
    }
    // halaman yang isinya pendek diperbesar sedikit (maks. 15%) supaya terasa penuh; yang kepanjangan diperkecil.
    // Lebar isi ikut dibagi zoom supaya tetap selebar kertas. Karena itu baris teks bisa bergeser,
    // jadi setelah ditata tiap halaman diukur ulang dan diperkecil lagi kalau masih melewati batas.
    var nTotal = hal.length;
    akar.innerHTML = hal.map(function (h, i) {
      if (h.blok[0].bag === 0) return '<section class="pg sampul">' + h.blok[0].html + '</section>';
      var z = h.t > TINGGI ? Math.max(0.6, TINGGI / h.t) : Math.min(1.15, TINGGI / h.t);
      return '<section class="pg"><div class="pgi" style="zoom:' + z.toFixed(3) + ';width:calc(180mm / ' + z.toFixed(3) + ');">'
        + h.blok.map(function (b) { return '<div class="blk">' + b.html + '</div>'; }).join('') + '</div>'
        + '<div class="kaki-pg"><img src="aset/logo-nawasena.png" alt="Nawasena"><i class="gr"></i><span class="tm">Sahabat karirmu</span><span style="margin-left:auto;">Peta potensimu · ' + x(nama) + '</span><span class="hl">' + (i + 1) + '</span></div></section>';
    }).join('');
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    [].slice.call(akar.querySelectorAll('.pgi')).forEach(function (el) {
      for (var i = 0; i < 8; i++) {
        var z = parseFloat(el.style.zoom) || 1, t = el.getBoundingClientRect().height;
        if (t <= TINGGI + 1) break;
        z = Math.max(0.55, z * (TINGGI / t) * 0.99);
        el.style.zoom = z.toFixed(3); el.style.width = 'calc(180mm / ' + z.toFixed(3) + ')';
      }
    });
    document.title = 'Peta Potensimu ' + nama;
  }

  async function jalan() {
    var info = document.getElementById('info');
    try {
      var C = window.NAWASENA_CONFIG, d;
      if (C.MODE_DEMO) {
        d = { profil: { nama: 'Demo' }, laporan: { bagian1: window.CONTOH_LAPORAN.bagian1 }, lengkap: { status: 'siap', bagian: window.CONTOH_LAPORAN.lengkap },
          cv: { sumber: 'susun', susun: { nama: 'Nadia Putri Rahmawati', kota: 'Surabaya', email: 'nadia@email.com', pendidikan: [{ gelar: 'S1 Teknik Industri', kampus: 'ITS', lulus: '2026' }], kerja: [], organisasi: [], keahlian: ['Analisis data'], tools: ['Excel'], bahasa: [], sertifikasi: [] } } };
      } else {
        var u = await window.API.sesi();
        if (!u) { info.textContent = 'Sesi habis. Buka lagi aplikasinya dan Login.'; return; }
        d = await window.API.muat();
      }
      if (jenis === 'cv') {
        if (!d.cv || d.cv.sumber !== 'susun') { info.textContent = 'CV ini kamu unggah sendiri, jadi tidak perlu diunduh dari sini.'; return; }
        cetakCV(d.cv.susun || {});
      } else {
        if (!d.lengkap || d.lengkap.status !== 'siap') { info.textContent = 'Peta potensimu belum lengkap. Tunggu sampai keenam bagian selesai disusun.'; return; }
        await cetakLaporan(d.profil.nama, d.laporan.bagian1 || {}, d.lengkap.bagian || {});
      }
      info.textContent = 'Tekan tombol di kanan, lalu pilih "Simpan sebagai PDF".';
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      await Promise.all([].slice.call(document.images).map(function (im) { return im.complete ? 0 : new Promise(function (ok) { im.onload = im.onerror = ok; }); }));
      setTimeout(function () { window.print(); }, 400);
    } catch (e) {
      info.textContent = 'Gagal memuat: ' + (e.message || e);
    }
  }
  jalan();
})();
</script>
