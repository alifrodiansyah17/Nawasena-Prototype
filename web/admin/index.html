<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nawasena · Backoffice</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">


  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    .row:hover { background: #F8FAFC; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 14px; color: #1E293B; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #009FE3; text-decoration: none; }
    a:hover { color: #0284C7; }
    h1, h2, h3, h4 { font-family: 'Nunito', 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0; color: #0F172A; letter-spacing: -0.015em; line-height: 1.15; }
    p { margin: 0; line-height: 1.55; }
    input, textarea { font-family: inherit; }
    input:focus, textarea:focus { outline: none; }
    input::placeholder, textarea::placeholder { color: #64748B; }
    .scroll { overflow-y: auto; scrollbar-width: thin; }
    .scroll::-webkit-scrollbar { width: 6px; }
    .scroll::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 999px; }
    .tap { cursor: pointer; transition: filter .12s ease, transform .12s ease; }
    .tap:hover { filter: brightness(0.97); }
    .tap:active { transform: scale(0.985); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1.1s linear infinite; }
  </style>

<style>
  #toast { position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px); background: #0F172A; color: #FFFFFF; font-size: 13.5px; padding: 12px 16px;
    border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
  #toast.tampil { opacity: 1; transform: translate(-50%, 0); }
  #toast.ok { background: #15803D; }
  #sibuk { position: fixed; inset: 0; background: rgba(255,255,255,0.6); display: none; align-items: center; justify-content: center; z-index: 40; }
  #sibuk.tampil { display: flex; }
  #sibuk div { display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E0F2FE; border-radius: 999px; padding: 12px 18px; font-weight: 700; color: #0284C7; }
  #sibuk i { width: 18px; height: 18px; border-radius: 999px; border: 2.5px solid #E0F2FE; border-top-color: #009FE3; animation: spin 1s linear infinite; display: block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="sibuk"><div><i></i><span>Tunggu sebentar…</span></div></div>
<template id="tpl">
<sc-if value="{{layarMuat}}"><div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #64748B;">Memuat…</div></sc-if>
<sc-if value="{{layarMasuk}}">
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F8FAFC; padding: 24px;">
  <div style="width: 100%; max-width: 380px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(2,132,199,0.08);">
    <img src="../aset/logo-nawasena.png" alt="Nawasena" style="height: 28px; width: auto; align-self: flex-start;">
    <div>
      <h1 style="font-size: 22px; font-weight: 800;">Backoffice Nawasena</h1>
      <p style="font-size: 13.5px; color: #64748B; margin-top: 6px;">Khusus tim Nawasena. Masuk pakai email dan kata sandi akun backoffice-mu. Sesi otomatis berakhir 24 jam setelah login.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 13px; font-weight: 600; color: #334155;">Email</div>
      <input type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="{{emailAdmin}}" onChange="{{setEmailAdmin}}" style="height: 48px; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 0 14px; font-size: 14px;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 13px; font-weight: 600; color: #334155;">Kata sandi</div>
      <div style="position: relative;">
        <input type="{{sandiTipe}}" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" value="{{sandiAdmin}}" onChange="{{setSandiAdmin}}" style="height: 48px; width: 100%; box-sizing: border-box; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 0 52px 0 14px; font-size: 14px;">
        <span class="tap" onClick="{{lihatSandiKlik}}" role="button" aria-label="{{lihatSandiLabel}}" title="{{lihatSandiLabel}}" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #64748B; cursor: pointer;"><sc-if value="{{mataBuka}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></sc-if><sc-if value="{{mataTutup}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0112 5c6.4 0 10 7 10 7a17.6 17.6 0 01-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a10.7 10.7 0 005.4-1.4"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg></sc-if></span>
      </div>
    </div>
    <sc-if value="{{galatMasuk}}"><p style="font-size: 13px; color: #B91C1C;">{{galatMasuk}}</p></sc-if>
    <div class="tap" onClick="{{masukAdminKlik}}" style="height: 50px; border-radius: 9999px; background: #FACC15; color: #0F172A; display: flex; align-items: center; justify-content: center; font-family: Nunito, sans-serif; font-weight: 800; font-size: 15px;">Masuk</div>
  </div>
</div>

</sc-if>
<sc-if value="{{layarBo}}">
<div style="width: 100%; min-width: 1240px; height: 100vh; display: flex; overflow: hidden; background: #F8FAFC;">
  <div style="width: 224px; flex-shrink: 0; background: #0284C7; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px;">
    <div style="padding: 0 6px;">
      <img src="../aset/logo-nawasena-putih.png" alt="Nawasena" style="height: 24px; width: auto; display: block;">
      <div style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #FFFFFF; margin-top: 8px;">Backoffice · internal</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <sc-if value="{{m.order.ada}}"><div class="tap" onClick="{{m.order.pick}}" style="{{m.order.st}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/></svg><span style="flex-grow: 1;">Authorize order</span><sc-if value="{{m.order.adaBadge}}"><span style="min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: #FACC15; color: #0F172A; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{m.order.badge}}</span></sc-if></div></sc-if>
      <sc-if value="{{m.refund.ada}}"><div class="tap" onClick="{{m.refund.pick}}" style="{{m.refund.st}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7.5v9"/><path d="M14.5 10c0-1-1.1-1.6-2.5-1.6s-2.5.6-2.5 1.6 1.1 1.5 2.5 1.5 2.5.6 2.5 1.6-1.1 1.6-2.5 1.6-2.5-.6-2.5-1.6"/></svg><span style="flex-grow: 1;">Refund</span></div></sc-if>
      <sc-if value="{{m.voucher.ada}}"><div class="tap" onClick="{{m.voucher.pick}}" style="{{m.voucher.st}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 7v2M14 11v2M14 15v2"/></svg><span style="flex-grow: 1;">Voucher</span></div></sc-if>
      <sc-if value="{{m.keuangan.ada}}"><div class="tap" onClick="{{m.keuangan.pick}}" style="{{m.keuangan.st}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/></svg><span style="flex-grow: 1;">Laporan keuangan</span></div></sc-if>
      <sc-if value="{{m.ambassador.ada}}"><div class="tap" onClick="{{m.ambassador.pick}}" style="{{m.ambassador.st}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18.5 14.6c1.8.8 2.8 2.6 3 5.4"/></svg><span style="flex-grow: 1;">Ambassador</span></div></sc-if>
      <sc-if value="{{m.akun.ada}}"><div class="tap" onClick="{{m.akun.pick}}" style="{{m.akun.st}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg><span style="flex-grow: 1;">Akun &amp; role</span></div></sc-if>
      <sc-if value="{{m.audit.ada}}"><div class="tap" onClick="{{m.audit.pick}}" style="{{m.audit.st}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg><span style="flex-grow: 1;">Audit trail</span></div></sc-if>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid rgba(255,255,255,0.15);">
      <div style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: #FACC15; color: #0F172A; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{adminInisial}}</div>
      <div style="min-width: 0;">
        <div style="font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{adminNama}}</div>
        <div style="font-size: 11.5px; color: #E0F2FE;">{{peranNama}} · <span class="tap" onClick="{{keluarKlik}}" style="text-decoration: underline; cursor: pointer;">Keluar</span></div>
        <div style="font-size: 10.5px; color: #BAE6FD; margin-top: 2px;">{{sesiSisa}}</div>
      </div>
    </div>
  </div>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 26px 32px 24px; gap: 18px;">

    <!-- ============================================================ AUTHORIZE ORDER -->
    <sc-if value="{{viewOrder}}">
      <div style="display: flex; flex-direction: column; gap: 18px; height: 100%; min-height: 0;">
        <div>
          <h1 style="font-size: 32px; line-height: 40px; font-weight: 800;">Authorize order</h1>
          <p style="font-size: 14px; color: #64748B; margin-top: 5px;">Cocokkan nominal unik di bukti bayar dengan mutasi rekening atau dasbor QRIS, lalu konfirmasi. Order yang tidak dibayar dalam 1 jam otomatis kedaluwarsa, tapi tetap tercatat.</p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;">
          <div style="border: 1px solid #E2E8F0; border-radius: 12px; padding: 15px 17px; background: #FFFFFF;"><div style="font-size: 12px; color: #64748B; font-weight: 600;">Menunggu dicek</div><div style="font-family: Nunito, sans-serif; font-size: 28px; font-weight: 800; color: #0F172A; margin-top: 4px;">{{nMenunggu}}</div><div style="font-size: 12px; color: #1E293B; margin-top: 2px;">{{lamaTeks}}</div></div>
          <div style="border: 1px solid #DCFCE7; border-radius: 12px; padding: 15px 17px; background: #F0FDF4;"><div style="font-size: 12px; color: #15803D; font-weight: 600;">Dikonfirmasi hari ini</div><div style="font-family: Nunito, sans-serif; font-size: 28px; font-weight: 800; color: #15803D; margin-top: 4px;">{{nOkHari}}</div><div style="font-size: 12px; color: #15803D; margin-top: 2px;">{{uangHari}} masuk hari ini</div></div>
          <div style="border: 1px solid #E2E8F0; border-radius: 12px; padding: 15px 17px; background: #FFFFFF;"><div style="font-size: 12px; color: #64748B; font-weight: 600;">Belum dibayar</div><div style="font-family: Nunito, sans-serif; font-size: 28px; font-weight: 800; color: #0284C7; margin-top: 4px;">{{nBelumBayar}}</div><div style="font-size: 12px; color: #1E293B; margin-top: 2px;">Order aktif, batas bayar 1 jam</div></div>
          <div style="border: 1px solid #E2E8F0; border-radius: 12px; padding: 15px 17px; background: #FFFFFF;"><div style="font-size: 12px; color: #64748B; font-weight: 600;">Kedaluwarsa hari ini</div><div style="font-family: Nunito, sans-serif; font-size: 28px; font-weight: 800; color: #475569; margin-top: 4px;">{{nExpHari}}</div><div style="font-size: 12px; color: #1E293B; margin-top: 2px;">Tidak dibayar dalam 1 jam</div></div>
        </div>
        <div style="flex-grow: 1; min-height: 0; display: flex; gap: 20px;">
          <div style="flex-grow: 1; min-width: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #F1F5F9;">
              <div style="display: flex; gap: 2px; flex-wrap: wrap;">
                <sc-for list="{{tabs}}" as="t"><div class="tap" onClick="{{t.pick}}" style="{{t.st}}">{{t.label}} <span style="{{t.nst}}">{{t.n}}</span></div></sc-for>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; height: 36px; border: 1.5px solid #E2E8F0; border-radius: 11px; padding: 0 12px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input value="{{cari}}" onChange="{{setCari}}" placeholder="Cari order, nama, email, nominal" style="border: none; outline: none; width: 100%; font-size: 13px; color: #1E293B; background: transparent;"></div>
            </div>
            <div style="display: grid; grid-template-columns: 64px minmax(0,1fr) 128px 70px 84px 116px; gap: 10px; padding: 10px 18px; background: #F8FAFC; border-bottom: 1px solid #F1F5F9; font-size: 11px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #64748B;"><span>Waktu</span><span>Pengguna</span><span>Order ID</span><span>Metode</span><span>Nominal</span><span>Status</span></div>
            <div class="scroll" style="flex-grow: 1;">
              <sc-for list="{{rows}}" as="r">
                <div class="row" onClick="{{r.pick}}" style="{{r.st}}"><span style="font-size: 12px; color: #1E293B; line-height: 1.35;">{{r.tgl}}<br><b>{{r.jam}}</b></span>
                  <div style="min-width: 0;"><div style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 14px; font-weight: 700; color: #0284C7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.nama}}</span><span style="{{r.baruSt}}">Baru</span><span style="{{r.refSt}}">{{r.refLbl}}</span></div><div style="font-size: 12px; color: #1E293B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.email}}</div></div>
                  <span style="font-size: 12px; color: #1E293B; font-weight: 700; letter-spacing: 0.02em;">{{r.pesanan}}</span><span style="font-size: 13px; color: #1E293B;">{{r.metodeK}}</span><span style="{{r.nomSt}}">{{r.nominal}}</span><span style="{{r.pillSt}}">{{r.pill}}</span>
                </div>
              </sc-for>
              <sc-if value="{{kosong}}"><div style="padding: 48px 20px; text-align: center; color: #94A3B8; font-size: 14px;">Belum ada order di daftar ini.</div></sc-if>
            </div>
          </div>
          <div class="scroll" style="width: 410px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
            <sc-if value="{{tanpaPilih}}"><div style="padding: 40px 10px; text-align: center; color: #94A3B8; font-size: 14px;">Pilih order di daftar untuk melihat detailnya.</div></sc-if>
            <sc-if value="{{adaPilih}}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
              <div><div style="font-size: 12px; color: #64748B; font-weight: 700; letter-spacing: 0.03em;">{{dPesanan}}</div><h2 style="font-size: 21px; font-weight: 800; margin-top: 3px;">{{dNama}}</h2><div style="font-size: 13px; color: #64748B; margin-top: 2px;">{{dEmail}}</div></div><span style="{{dPillSt}}">{{dPill}}</span>
            </div>
            <sc-if value="{{dAdaBukti}}">
            <div style="border-radius: 12px; background: #F1F5F9; border: 1px solid #E2E8F0; min-height: 150px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; position: relative; overflow: hidden;">
              <sc-if value="{{dGambar}}"><img src="{{dBuktiUrl}}" alt="Bukti bayar" style="width: 100%; max-height: 360px; object-fit: contain; display: block; background: #FFFFFF;"></sc-if>
              <sc-if value="{{dBukanGambar}}"><div style="font-size: 13px; font-weight: 700; color: #1E293B; padding: 40px 12px; text-align: center;">{{dFile}}</div></sc-if>
              <div class="tap" onClick="{{bukaBukti}}" style="position: absolute; right: 10px; top: 10px; font-size: 12px; font-weight: 700; color: #0284C7; background: #FFFFFF; border-radius: 9px; padding: 6px 10px; border: 1px solid #E0F2FE; cursor: pointer;">Buka ukuran penuh</div>
            </div>
            </sc-if>
            <sc-if value="{{dTanpaBukti}}"><div style="border-radius: 12px; background: #F8FAFC; border: 1.5px dashed #E2E8F0; padding: 22px 14px; text-align: center; font-size: 13px; color: #64748B;">Belum ada bukti bayar dari pengguna.</div></sc-if>
            <div style="display: flex; flex-direction: column; gap: 9px;">
              <div style="display: flex; justify-content: space-between; gap: 14px; align-items: baseline;"><span style="font-size: 13px; color: #64748B;">Tagihan</span><span style="font-family: Nunito, sans-serif; font-size: 18px; font-weight: 800; color: #0284C7; text-align: right;">{{dTagihan}}</span></div>
              <div style="font-size: 11.5px; color: #64748B; text-align: right; margin-top: -6px;">{{dRincian}}</div>
              <div style="display: flex; justify-content: space-between; gap: 14px; align-items: baseline;"><span style="font-size: 13px; color: #64748B;">Metode</span><span style="font-size: 13px; font-weight: 700; color: #1E293B; text-align: right;">{{dMetode}}</span></div>
              <div style="display: flex; justify-content: space-between; gap: 14px; align-items: baseline;"><span style="font-size: 13px; color: #64748B; flex-shrink: 0;">Tujuan</span><span style="font-size: 13px; font-weight: 700; color: #1E293B; text-align: right;">{{dTujuan}}</span></div>
              <div style="display: flex; justify-content: space-between; gap: 14px; align-items: baseline;"><span style="font-size: 13px; color: #64748B;">Order dibuat</span><span style="font-size: 13px; font-weight: 700; color: #1E293B; text-align: right;">{{dDibuat}}</span></div>
              <div style="display: flex; justify-content: space-between; gap: 14px; align-items: baseline;"><span style="font-size: 13px; color: #64748B;">Batas bayar</span><span style="font-size: 13px; font-weight: 700; color: #1E293B; text-align: right;">{{dBatas}}</span></div>
              <div style="display: flex; justify-content: space-between; gap: 14px; align-items: baseline;"><span style="font-size: 13px; color: #64748B;">Bukti diunggah</span><span style="font-size: 13px; font-weight: 700; color: #1E293B; text-align: right;">{{dWaktu}}</span></div>
            </div>
            <sc-if value="{{dBelumBayar}}"><div style="background: #F0F9FF; border: 1px solid #E0F2FE; border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: #075985; line-height: 1.5;">Menunggu pengguna membayar dan mengunggah bukti. Kalau lewat batas bayar, order ini otomatis jadi <b>Kedaluwarsa</b>.</div></sc-if>
            <sc-if value="{{dKedaluwarsa}}"><div style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: #475569; line-height: 1.5;">Order dibatalkan otomatis karena tidak dibayar dalam 1 jam. Order ID tetap tersimpan untuk log. Kalau pengguna ternyata sudah bayar, ia tetap bisa mengunggah bukti (sampai 24 jam) dan order kembali ke Menunggu.</div></sc-if>
