<!doctype html>
<html lang="id" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0284C7">
<title>Nawasena · Peta Potensimu</title>
<link rel="icon" type="image/png" href="aset/logo-nawasena.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root { --tinggi: 100vh; }
  @supports (height: 100dvh) { :root { --tinggi: 100dvh; } }
  html, body { margin: 0; background: #E0F2FE; }
  body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 14px; color: #1E293B; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #009FE3; text-decoration: none; }
  a:hover { color: #0284C7; }
  h1, h2, h3, h4 { font-family: 'Nunito', 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0; color: #0F172A; letter-spacing: -0.015em; line-height: 1.15; }
  p { margin: 0; line-height: 1.55; }
  input, textarea { font-family: inherit; font-size: 16px !important; }
  input:focus, textarea:focus { outline: none; border-color: #009FE3 !important; }
  input::placeholder, textarea::placeholder { color: #94A3B8; }
  .scroll { overflow-y: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 999px; }
  /* Motion: tombol membal saat ditekan, perubahan warna halus, layar bergeser saat pindah (lihat app.js: animasiLayar) */
  .tap { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), filter .15s ease, background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .2s ease; }
  @media (hover: hover) { .tap:hover { filter: brightness(0.97); } }
  .tap:active { transform: scale(0.96); filter: brightness(0.94); transition-duration: .08s; }
  @keyframes muncul { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes goyang { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  [data-kosong="1"] { animation: muncul .2s ease-out both, goyang .4s ease .2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes kedip { 50% { opacity: .45; } }
  .kedip { animation: kedip 1.2s ease-in-out infinite; }
  .spin { animation: spin 1.1s linear infinite; }
  #app { max-width: 480px; margin: 0 auto; background: #FFFFFF; min-height: var(--tinggi); position: relative; }
  @media (min-width: 520px) { #app { box-shadow: 0 0 0 1px #E2E8F0, 0 24px 60px rgba(2,132,199,0.12); } }
  /* Tampilan komputer (lebar ≥ 1024px): layar versi desktop, penuh selebar jendela */
  body.desktop { background: #FFFFFF; }
  body.desktop #app { max-width: none; box-shadow: none; }
  body.desktop img[alt="Nawasena"] { width: auto !important; align-self: center; object-fit: contain; }
  body.desktop [style*="flex-direction: column"] > img[alt="Nawasena"] { align-self: flex-start; }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); max-width: min(440px, calc(100% - 32px)); width: max-content;
    background: #0F172A; color: #FFFFFF; font-size: 13.5px; line-height: 1.45; padding: 12px 16px; border-radius: 12px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 50; box-shadow: 0 12px 30px rgba(15,23,42,0.25); }
  #toast.tampil { opacity: 1; transform: translate(-50%, 0); }
  #toast.ok { background: #15803D; }
  #sibuk { position: fixed; inset: 0; background: rgba(255,255,255,0.72); display: flex; align-items: center; justify-content: center; z-index: 40;
    opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility 0s linear .18s; }
  #sibuk.tampil { opacity: 1; visibility: visible; transition: opacity .18s ease .12s, visibility 0s; }
  #sibuk > div { transform: scale(.94); transition: transform .25s cubic-bezier(.34,1.56,.64,1) .12s; }
  #sibuk.tampil > div { transform: none; }
  #sibuk div { display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E0F2FE; border-radius: 999px; padding: 12px 18px;
    box-shadow: 0 10px 30px rgba(2,132,199,0.15); font-weight: 700; color: #0284C7; font-size: 14px; }
  #sibuk i { width: 18px; height: 18px; border-radius: 999px; border: 2.5px solid #E0F2FE; border-top-color: #009FE3; animation: spin 1s linear infinite; display: block; }
  /* Latar halaman peta potensimu: biru muda, matahari pudar di pojok, logo samar di bawah. Tidak ikut digulir. */
  .latar-lap { background:
      url(aset/matahari-pudar.svg) right -90px top -90px / 340px no-repeat,
      url(aset/logo-nawasena-pudar.png) right 32px bottom 26px / 150px auto no-repeat,
      radial-gradient(520px 380px at 0% 100%, rgba(56,189,248,.14), transparent 70%),
      radial-gradient(420px 320px at 100% 0%, rgba(250,204,21,.10), transparent 70%),
      #F0F9FF; }
  .lap-kartu { box-shadow: 0 2px 10px rgba(2,132,199,.06); }
  body:not(.desktop) .latar-lap { background-position: right -80px top 20px, right 20px bottom 18px, 0 0, 0 0, 0 0; background-size: 210px, 110px auto, auto, auto, auto; }
  /* Peta potensimu (komputer): kolom isi + panel samping yang ikut menempel saat digulir */
  .lap-baris { display: flex; gap: 36px; max-width: 1440px; margin: 0 auto; align-items: flex-start; }
  .lap-isi { flex: 1; min-width: 0; max-width: 1080px; display: flex; flex-direction: column; gap: 20px; }
  .lap-rel { width: 300px; flex-shrink: 0; position: sticky; top: 0; display: none; flex-direction: column; gap: 14px; }
  @media (min-width: 1400px) { .lap-rel { display: flex; } }
  .lap-kartu { border: 1px solid #E0F2FE; border-radius: 16px; padding: 18px; background: #FFFFFF; }
  #app input, #app textarea { min-width: 0; max-width: 100%; }
  input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 52px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .tap:active { transform: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sibuk"><div><i></i><span>Tunggu sebentar…</span></div></div>
<input type="file" id="pilihBerkas" hidden>
<template id="tpl">
<sc-if value="{{is_muat}}">
<div style="height: var(--tinggi); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FFFFFF;">
  <img src="aset/logo-nawasena.png" alt="Nawasena" style="height: 30px; width: auto; display: block;">
  <div class="spin" style="width: 28px; height: 28px; border-radius: 999px; border: 3px solid #E0F2FE; border-top-color: #009FE3;"></div>
</div>
</sc-if>
<sc-if value="{{is_landing}}">
<div style="height: var(--tinggi); display: flex; flex-direction: column; background: #FFFFFF; overflow: hidden;">
  <div class="scroll" style="flex-grow: 1; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 18px;">
    <div style="padding-top: 18px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;"><img src="aset/logo-nawasena.png" alt="Nawasena" style="height: 32px; width: auto; display: block;"><span style="width: 1px; height: 20px; background: #CBD5E1; flex-shrink: 0;"></span><span style="font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; color: #0284C7; white-space: nowrap;">Sahabat karirmu</span></div>
      <div class="tap" onClick="{{go_masuk}}" style="font-size: 13.5px; font-weight: 700; color: #0284C7;">Login
      </div>
    </div>
    <div style="position: relative; overflow: hidden; flex-shrink: 0; background: #F0F9FF; border: 1px solid rgba(0,159,227,0.18); border-bottom: 4px solid #FACC15; border-radius: 20px; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 14px;">
      <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: repeating-conic-gradient(from 0deg at 100% 0%, rgba(250,204,21,0.18) 0deg 5deg, transparent 5deg 13deg); -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 0, rgba(0,0,0,0.55) 40%, transparent 78%); mask-image: radial-gradient(circle at 100% 0%, #000 0, rgba(0,0,0,0.55) 40%, transparent 78%);"></div>
      <img src="aset/matahari.svg" alt="" aria-hidden="true" style="position: absolute; right: -28px; top: -28px; width: 104px; height: 104px; pointer-events: none;">
      <div style="position: relative; align-self: flex-start; max-width: 76%; background: #FEF9C3; color: #0F172A; font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 999px;">Buat kamu yang mau meraih masa depanmu
      </div>
      <h1 style="position: relative; font-size: 32px; line-height: 40px; font-weight: 800; padding-right: 48px;">Kenali potensimu, raih masa depanmu</h1>
      <p style="position: relative; font-size: 15.5px; color: #334155;">Tinggal pilih kalimat yang paling terasa seperti kamu. Nanti kamu dapat <b style="color: #0F172A;">gambaran utuh soal dirimu</b> — apa yang jadi kekuatanmu, arah karir yang mungkin cocok, dan langkah kecil yang bisa kamu mulai.</p>
    </div>
    <div style="background: #F8FAFC; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 15px;">
      <div style="font-size: 12px; font-weight: 700; color: #64748B; letter-spacing: 0.08em; text-transform: uppercase;">Yang akan kamu dapat
      </div>
      <div style="display: flex; gap: 13px; align-items: flex-start;">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: #E0F2FE; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#009FE3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/>
          </svg>
        </div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: #0284C7;">Kenali potensi dirimu
          </div>
          <p style="font-size: 13px; color: #64748B; margin-top: 3px;">Hal-hal yang selama ini kamu kira biasa saja, ternyata justru yang bikin kamu beda.</p>
        </div>
      </div>
      <div style="display: flex; gap: 13px; align-items: flex-start;">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: #E0F2FE; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#009FE3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.2 8.8l-2 5.4-5.4 2 2-5.4 5.4-2z"/>
          </svg>
        </div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: #0284C7;">Pekerjaan yang cocok buat kamu
          </div>
          <p style="font-size: 13px; color: #64748B; margin-top: 3px;">Hari-harinya seperti apa, jenjangnya ke mana, dan kisaran gajinya.</p>
        </div>
      </div>
      <div style="display: flex; gap: 13px; align-items: flex-start;">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: #FEF9C3; display: flex; align-items: center; justify-content: center;">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/>
          </svg>
        </div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: #0284C7;">CV kamu, kita buat bareng
          </div>
          <p style="font-size: 13px; color: #64748B; margin-top: 3px;">Belum pernah bikin CV? Santai, kita susun bareng dari nol.</p>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; border: 1px solid #E2E8F0; border-radius: 12px; padding: 13px 14px;">
        <div style="font-family: Nunito, sans-serif; font-size: 21px; font-weight: 800; color: #0284C7;">Arah karir
        </div>
        <div style="font-size: 12px; color: #1E293B; margin-top: 2px;">sesuai dengan potensimu
        </div>
      </div>
      <div style="flex-grow: 1; border: 1px solid #E2E8F0; border-radius: 12px; padding: 13px 14px;">
        <div style="font-family: Nunito, sans-serif; font-size: 21px; font-weight: 800; color: #0284C7;">Gratis
        </div>
        <div style="font-size: 12px; color: #1E293B; margin-top: 2px;">buat mulai
        </div>
      </div>
    </div>
    <div style="border: 1px solid rgba(2,132,199,0.22); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 12px; font-weight: 700; color: #0284C7; letter-spacing: 0.08em; text-transform: uppercase;">Tentang Nawasena
      </div>
      <p style="font-size: 13.5px; color: #334155; line-height: 1.6;">Nawasena adalah sahabat karir yang membantumu mengenal diri dan menyusun arah karir ke depan, dari masa kuliah sampai kamu berkembang di dunia kerja.</p>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;">
        <a href="mailto:{{emailKontak}}" class="tap" style="text-decoration: none; display: flex; align-items: center; gap: 9px; color: #0284C7; font-size: 13.5px; font-weight: 700;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg><span>{{emailKontak}}</span></a>
        <a href="{{waBase}}" target="_blank" rel="noopener" class="tap" style="text-decoration: none; display: flex; align-items: center; gap: 9px; color: #0284C7; font-size: 13.5px; font-weight: 700;"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink: 0;"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/><path d="M16.9 14.3c-.3-.1-1.6-.8-1.9-.9-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.3-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5.3-.5V9.4c0-.2-.6-1.5-.9-2-.2-.5-.4-.4-.6-.4h-.6c-.2 0-.5.1-.7.4-.3.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/></svg><span>WhatsApp {{waTampil}}</span></a>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0 4px; text-align: center;">
      <div style="display: flex; align-items: center; gap: 10px;"><img src="aset/logo-nawasena.png" alt="Nawasena" style="height: 26px; width: auto; display: block;"><span style="width: 1px; height: 16px; background: #CBD5E1; flex-shrink: 0;"></span><span style="font-family: Nunito, sans-serif; font-size: 12px; font-weight: 800; color: #0284C7; white-space: nowrap;">Sahabat karirmu</span></div>
      <a href="privasi.html" target="_blank" rel="noopener" style="font-size: 12.5px; font-weight: 700; color: #0284C7;">Kebijakan Privasi</a>
      <div style="font-size: 12px; color: #64748B;">© {{tahun}} Nawasena. Hak cipta dilindungi.
      </div>
    </div>
  </div>
  <div style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 11px; border-top: 1px solid #F1F5F9; background: #FFFFFF; flex-shrink: 0;">
    <div class="tap" onClick="{{mulaiDaftar}}" style="width: 100%; height: 54px; border-radius: 9999px; display: flex; align-items: center; justify-content: center;  font-size: 14px; font-weight: 700; font-family: Nunito, sans-serif; background: #FACC15; color: #0F172A; box-shadow: 0 6px 16px rgba(250,204,21,0.35);">Raih masa depanmu di sini
    </div>
    <p style="font-size: 13px; color: #64748B; text-align: center;">Gratis buat mulai</p><a href="{{waBase}}?text=Halo%20Nawasena%2C%20aku%20lagi%20kesulitan%20waktu%20pakai%20aplikasinya." target="_blank" rel="noopener" class="tap" style="text-decoration: none; display: block; ">
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; color: #0284C7; font-size: 13px; font-weight: 700; padding-top: 2px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/><path d="M16.9 14.3c-.3-.1-1.6-.8-1.9-.9-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.3-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5.3-.5V9.4c0-.2-.6-1.5-.9-2-.2-.5-.4-.4-.6-.4h-.6c-.2 0-.5.1-.7.4-.3.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/>
      </svg>Ada kendala? Chat kami di WhatsApp
    </div></a>
  </div>
</div>
</sc-if>
<sc-if value="{{is_masuk}}">
<div style="height: var(--tinggi); display: flex; flex-direction: column; background: #FFFFFF; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; flex-shrink: 0;">
    <div class="tap" onClick="{{go_landing}}" style="width: 44px; height: 44px; display: flex; align-items: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/>
      </svg>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #64748B;">Login
    </div>
    <div style="min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end;"><a href="{{waBase}}?text=Halo%20Nawasena%2C%20aku%20lagi%20kesulitan%20waktu%20pakai%20aplikasinya." target="_blank" rel="noopener" class="tap" style="text-decoration: none; display: block; "><span style="display: inline-flex; align-items: center; gap: 5px; color: #0284C7; font-size: 12px; font-weight: 700; white-space: nowrap;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2z"/><path d="M16.9 14.3c-.3-.1-1.6-.8-1.9-.9-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.3-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5.3-.5V9.4c0-.2-.6-1.5-.9-2-.2-.5-.4-.4-.6-.4h-.6c-.2 0-.5.1-.7.4-.3.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/>
      </svg>Bantuan</span></a>
    </div>
  </div>
  <div class="scroll" style="flex-grow: 1; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 18px;">
    <div style="width: 62px; height: 62px; margin-top: 8px; border-radius: 20px; background: #E0F2FE; display: flex; align-items: center; justify-content: center;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#009FE3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
      </svg>
    </div>
    <div style="padding-top: 8px;">
      <h2 style="font-size: 24px; line-height: 32px; font-weight: 700;">Selamat datang lagi</h2>
      <p style="font-size: 14px; color: #64748B; margin-top: 8px;">Login pakai email atau nomor HP yang dulu kamu daftarkan — semua yang pernah kamu isi masih tersimpan rapi.</p>
